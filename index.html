<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>兆煜AI</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f8f5;
        --panel: #fbfffc;
        --panel-strong: #ffffff;
        --ink: #171d22;
        --muted: #6b7a77;
        --line: #d8e2da;
        --accent: #0f766e;
        --accent-strong: #064e3b;
        --accent-soft: #e5f5ef;
        --warm: #84cc16;
        --danger: #b42318;
        --warning: #a15c07;
        --success: #16704b;
        --shadow: 0 22px 70px rgba(15, 23, 42, 0.1);
        --shadow-soft: 0 12px 32px rgba(15, 118, 110, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 12% 16%, rgba(16, 185, 129, 0.1), transparent 28%),
          radial-gradient(circle at 86% 78%, rgba(245, 158, 11, 0.075), transparent 26%),
          linear-gradient(135deg, #f7faf8 0%, #f9fbfa 48%, #fcfbf7 100%),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        z-index: -2;
        background:
          linear-gradient(
            rgba(15, 118, 110, 0.014) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            rgba(15, 118, 110, 0.014) 1px,
            transparent 1px
          ),
          linear-gradient(
            115deg,
            transparent 0%,
            transparent 36%,
            rgba(15, 118, 110, 0.028) 36.15%,
            transparent 36.45%,
            transparent 64%,
            rgba(196, 122, 26, 0.022) 64.15%,
            transparent 64.45%,
            transparent 100%
          );
        background-size: 36px 36px, 36px 36px, auto;
        mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.62), transparent 78%);
      }

      body::after {
        z-index: -1;
        background:
          radial-gradient(circle at -80px -110px, rgba(167, 243, 208, 0.18) 0 190px, transparent 250px),
          radial-gradient(circle at calc(100% + 96px) 24px, rgba(153, 246, 228, 0.12) 0 160px, transparent 235px),
          radial-gradient(circle at calc(100% + 80px) calc(100% + 120px), rgba(254, 243, 199, 0.24) 0 190px, transparent 270px),
          radial-gradient(circle at -140px -120px, transparent 0 438px, rgba(15, 118, 110, 0.045) 439px 440px, transparent 441px 560px, rgba(15, 118, 110, 0.035) 561px 562px, transparent 563px 680px, rgba(15, 118, 110, 0.026) 681px 682px, transparent 683px),
          radial-gradient(circle at calc(100% + 220px) calc(100% + 260px), transparent 0 578px, rgba(15, 118, 110, 0.032) 579px 580px, transparent 581px 760px, rgba(180, 83, 9, 0.045) 761px 762px, transparent 763px);
        filter: blur(0);
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1220px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 42px;
      }

      .topbar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        margin-bottom: 22px;
        padding: 30px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(250, 255, 252, 0.82)),
          linear-gradient(110deg, rgba(15, 118, 110, 0.12), rgba(132, 204, 22, 0.08));
        box-shadow: var(--shadow-soft);
      }

      .topbar::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 6px;
        background: linear-gradient(180deg, var(--accent), #14b8a6, var(--warm));
      }

      .topbar > * {
        position: relative;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .brand-logo-area {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .brand-icon {
        position: relative;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        border-radius: 16px;
        background: linear-gradient(145deg, #047857 0%, #0f766e 48%, #0ea5a3 100%);
        color: #fff;
        box-shadow:
          0 14px 32px rgba(15, 118, 110, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }

      .brand-icon::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 20px;
        background: linear-gradient(
          135deg,
          rgba(20, 184, 166, 0.26),
          rgba(132, 204, 22, 0.14),
          transparent 68%
        );
        filter: blur(14px);
        opacity: 0.65;
        z-index: -1;
      }

      .brand-icon svg {
        width: 30px;
        height: 30px;
      }

      .brand-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .brand-title {
        position: relative;
        display: inline-flex;
        align-items: baseline;
        gap: 12px;
        margin: 0;
        font-size: 40px;
        line-height: 1;
        font-weight: 950;
        letter-spacing: 0.04em;
        background: linear-gradient(
          105deg,
          #0f172a 0%,
          #10201d 28%,
          #0f766e 58%,
          #16a34a 78%,
          #0ea5a3 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 10px 28px rgba(15, 118, 110, 0.12);
      }

      .brand-title::after {
        content: "";
        position: absolute;
        left: 2px;
        bottom: -10px;
        width: 96px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          rgba(15, 118, 110, 0.9) 0%,
          rgba(20, 184, 166, 0.55) 48%,
          rgba(132, 204, 22, 0.36) 76%,
          transparent 100%
        );
        box-shadow:
          0 0 14px rgba(20, 184, 166, 0.24),
          0 0 28px rgba(132, 204, 22, 0.12);
      }

      .brand-name {
        font-weight: 950;
      }

      .brand-ai {
        position: relative;
        font-size: 0.92em;
        font-weight: 950;
        letter-spacing: 0.1em;
        background: linear-gradient(135deg, #0f766e 0%, #14b8a6 48%, #84cc16 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .brand-ai::after {
        content: "";
        position: absolute;
        right: -8px;
        top: 3px;
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: #84cc16;
        box-shadow:
          0 0 8px rgba(132, 204, 22, 0.75),
          0 0 16px rgba(20, 184, 166, 0.35);
      }

      .brand-desc {
        margin: 0;
        padding-top: 4px;
        color: #6b7a77;
        font-size: 14px;
        line-height: 1.7;
        letter-spacing: 0.01em;
      }

      .subtitle {
        max-width: 720px;
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .status-pill,
      .member-pill,
      .info-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 8px 15px;
        border: 1px solid rgba(14, 117, 105, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--muted);
        white-space: nowrap;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
      }

      .top-actions {
        display: grid;
        gap: 10px;
        justify-items: end;
      }

      .profile-card {
        min-width: min(100%, 420px);
        border: 1px solid rgba(216, 226, 218, 0.96);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(246, 253, 249, 0.92));
        box-shadow: var(--shadow-soft);
        padding: 20px;
        margin-bottom: 22px;
      }

      .profile-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .profile-title {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 17px;
        font-weight: 800;
      }

      .profile-title::before {
        content: "";
        width: 8px;
        height: 22px;
        border-radius: 999px;
        background: var(--accent);
      }

      .profile-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .profile-card .actions {
        margin-top: 12px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--muted);
      }

      .dot.running {
        background: var(--warning);
        box-shadow: 0 0 0 5px rgba(161, 92, 7, 0.12);
      }

      .dot.done {
        background: var(--success);
      }

      .dot.error {
        background: var(--danger);
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }

      .panel {
        border: 1px solid rgba(216, 226, 218, 0.96);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(250, 255, 252, 0.96));
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .form-panel {
        position: sticky;
        top: 16px;
        padding: 24px;
      }

      .result-panel {
        min-height: 620px;
        overflow: hidden;
      }

      .works-panel {
        margin-top: 22px;
      }

      .auth-panel {
        margin-bottom: 22px;
        padding: 20px;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 16px;
        font-size: 17px;
        font-weight: 850;
        color: #12181e;
      }

      .section-title::before {
        content: "";
        width: 8px;
        height: 22px;
        border-radius: 999px;
        background: var(--accent);
      }

      .mode-switch {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 0 0 20px;
        padding: 6px;
        border: 1px solid rgba(14, 117, 105, 0.14);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(229, 245, 239, 0.88), rgba(255, 255, 255, 0.74));
      }

      .mode-option {
        min-height: 46px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--accent-strong);
        box-shadow: none;
      }

      .mode-option.is-active {
        border-color: rgba(14, 117, 105, 0.18);
        background: var(--panel-strong);
        color: var(--ink);
        box-shadow: 0 10px 20px rgba(15, 118, 110, 0.1);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
      }

      label {
        color: #26322f;
        font-size: 13px;
        font-weight: 780;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-strong);
        color: var(--ink);
        outline: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease,
          background 0.16s ease;
      }

      input,
      select {
        min-height: 48px;
        padding: 0 14px;
      }

      .readonly-field {
        display: flex;
        align-items: center;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(229, 245, 239, 0.62), rgba(255, 255, 255, 0.92));
        color: var(--ink);
        font-size: 16px;
        font-weight: 400;
        padding: 0 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
      }

      textarea {
        min-height: 154px;
        resize: vertical;
        padding: 15px;
        line-height: 1.65;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(20, 108, 95, 0.12);
      }

      input[type="file"] {
        padding: 10px 12px;
        color: var(--muted);
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .upload-control {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 60px;
        border: 1px dashed rgba(15, 118, 110, 0.26);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(229, 245, 239, 0.58), rgba(255, 255, 255, 0.92));
        padding: 8px;
      }

      .upload-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border-radius: 6px;
        background: #ffffff;
        color: var(--accent-strong);
        box-shadow: 0 8px 18px rgba(15, 118, 110, 0.08);
        cursor: pointer;
        font-weight: 750;
        padding: 0 15px;
        white-space: nowrap;
      }

      .upload-status {
        min-width: 0;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        padding: 0 16px;
        cursor: pointer;
        font-weight: 750;
        transition:
          transform 0.16s ease,
          background 0.16s ease,
          opacity 0.16s ease;
      }

      button:active {
        transform: translateY(1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      .primary {
        flex: 1;
        min-height: 50px;
        background: linear-gradient(135deg, #0f766e, #047857 52%, #064e3b);
        color: #fff;
        box-shadow: 0 14px 28px rgba(15, 118, 110, 0.24);
      }

      .secondary {
        min-height: 42px;
        border: 1px solid rgba(15, 118, 110, 0.16);
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .ghost {
        min-height: 34px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.7);
        color: var(--muted);
      }

      .reference-tools {
        display: grid;
        gap: 10px;
      }

      .reference-preview {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
        gap: 8px;
      }

      .reference-item {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 8px 18px rgba(38, 44, 39, 0.08);
      }

      .reference-preview img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #eee7dc;
      }

      .reference-remove {
        position: absolute;
        top: 5px;
        right: 5px;
        display: grid;
        place-items: center;
        width: 24px;
        min-height: 24px;
        height: 24px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--danger);
        padding: 0;
        line-height: 1;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
      }

      .custom-size {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .result-head,
      .works-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(90deg, rgba(229, 245, 239, 0.82), rgba(255, 255, 255, 0.72));
      }

      .task-id {
        min-width: 0;
        color: var(--muted);
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result-body,
      .works-body {
        padding: 22px;
      }

      .empty,
      .empty-works {
        display: grid;
        place-items: center;
        min-height: 320px;
        border: 1px dashed rgba(14, 117, 105, 0.26);
        border-radius: 8px;
        background:
          linear-gradient(45deg, rgba(15, 118, 110, 0.045) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(132, 204, 22, 0.035) 25%, transparent 25%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(245, 253, 249, 0.82)),
          var(--panel);
        background-size: 28px 28px, 28px 28px, auto, auto;
        color: var(--muted);
        text-align: center;
        padding: 28px;
      }

      .empty strong {
        display: block;
        margin-bottom: 10px;
        color: var(--ink);
        font-size: 20px;
      }

      .loader {
        width: 42px;
        height: 42px;
        margin: 0 auto 14px;
        border: 4px solid rgba(14, 117, 105, 0.14);
        border-top-color: var(--accent);
        border-radius: 999px;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .gallery,
      .works-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }

      .image-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.07);
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease;
      }

      .image-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 40px rgba(15, 118, 110, 0.12);
      }

      .image-card img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        background: #eee7dc;
      }

      .image-card video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #12181e;
      }

      .image-actions,
      .work-meta {
        display: grid;
        gap: 7px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }

      .image-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: max-content;
        min-height: 30px;
        border-radius: 999px;
        background: var(--accent-soft);
        padding: 0 12px;
        color: var(--accent-strong);
        font-size: 13px;
        font-weight: 750;
        text-decoration: none;
      }

      .work-prompt {
        display: -webkit-box;
        min-height: 40px;
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .work-info {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .log {
        display: grid;
        gap: 8px;
        margin-top: 16px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.74);
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .alert {
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(180, 35, 24, 0.25);
        background: rgba(180, 35, 24, 0.08);
        color: var(--danger);
        line-height: 1.55;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 860px) {
        .topbar {
          align-items: start;
          flex-direction: column;
        }

        .brand-logo-area {
          gap: 14px;
        }

        .brand-icon {
          width: 48px;
          height: 48px;
          flex-basis: 48px;
          border-radius: 14px;
        }

        .brand-icon svg {
          width: 26px;
          height: 26px;
        }

        .brand-title {
          font-size: 32px;
        }

        .brand-title::after {
          width: 78px;
          bottom: -8px;
        }

        .brand-desc {
          font-size: 13px;
        }

        .top-actions {
          justify-items: start;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .form-panel {
          position: static;
        }
      }

      @media (max-width: 560px) {
        .shell {
          width: min(100vw - 20px, 1180px);
          padding-top: 18px;
        }

        .row,
        .actions {
          grid-template-columns: 1fr;
          flex-direction: column;
        }

        .result-head,
        .works-head {
          align-items: start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-logo-area">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2.5L13.8 8.2L19.5 10L13.8 11.8L12 17.5L10.2 11.8L4.5 10L10.2 8.2L12 2.5Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M18.5 14.5L19.4 17.1L22 18L19.4 18.9L18.5 21.5L17.6 18.9L15 18L17.6 17.1L18.5 14.5Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="brand-title-wrap">
            <h1 class="brand-title">
              <span class="brand-name">兆煜</span>
              <span class="brand-ai">AI</span>
            </h1>
            <p class="brand-desc">智能图片 / 视频生成工作台</p>
          </div>
        </div>
      </header>

      <section id="authPanel" class="profile-card">
        <div class="profile-head">
          <div class="profile-title">个人信息</div>
          <button id="logoutBtn" class="ghost hidden" type="button">退出</button>
        </div>
        <div class="status-pill hidden" aria-live="polite">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">待登录</span>
        </div>
        <div id="memberPill" class="member-pill hidden">未登录</div>
        <div id="profileSummary" class="profile-summary"></div>
        <form id="authForm">
          <div class="row">
            <div class="field">
              <label for="email">邮箱</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="password">密码</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                required
              />
            </div>
          </div>
          <div class="actions">
            <button id="loginBtn" class="primary" type="submit" data-mode="login">登录</button>
            <button id="registerBtn" class="secondary" type="button">注册</button>
          </div>
          <div id="authMessage" class="hint"></div>
        </form>
      </section>

      <section class="grid">
        <form id="imageForm" class="panel form-panel">
          <h2 class="section-title">生成参数</h2>

          <div class="mode-switch" role="tablist" aria-label="生成类型">
            <button
              class="mode-option is-active"
              type="button"
              data-generation-mode="image"
              aria-selected="true"
            >
              图片生成
            </button>
            <button
              class="mode-option"
              type="button"
              data-generation-mode="video"
              aria-selected="false"
            >
              视频生成
            </button>
          </div>

          <div class="field">
            <label for="prompt">提示词</label>
            <textarea
              id="prompt"
              name="prompt"
              required
              placeholder="一张电影质感的未来城市夜景，雨后街道反射霓虹灯光，细节丰富"
            ></textarea>
          </div>

          <div class="field">
            <label for="referenceFiles">参考图</label>
            <div class="reference-tools">
              <input
                class="file-input"
                id="referenceFiles"
                name="referenceFiles"
                type="file"
                accept="image/*"
                multiple
              />
              <div class="upload-control">
                <label class="upload-button" for="referenceFiles">上传图片</label>
                <span id="referenceFileStatus" class="upload-status">未选择图片</span>
              </div>
              <div id="referencePreview" class="reference-preview hidden"></div>
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="model">模型</label>
              <select id="model" name="model" required>
                <option value="gpt-image-2" selected>GPT2</option>
              </select>
            </div>
            <div class="field">
              <label for="size">尺寸</label>
              <select id="size" name="size">
                <option value="auto" selected>auto</option>
                <option value="1024x1024">1024x1024</option>
                <option value="1792x1024">1792x1024</option>
                <option value="1024x1792">1024x1792</option>
                <option value="3840x2160">3840x2160</option>
                <option value="2560x1440">2560x1440</option>
                <option value="1:1">1:1</option>
                <option value="3:2">3:2</option>
                <option value="2:3">2:3</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
                <option value="1:2">1:2</option>
                <option value="2:1">2:1</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
                <option value="5:4">5:4</option>
                <option value="4:5">4:5</option>
                <option value="custom">自定义尺寸</option>
              </select>
              <div id="customSizeFields" class="custom-size hidden">
                <input
                  id="customWidth"
                  name="customWidth"
                  type="number"
                  min="16"
                  max="3840"
                  step="16"
                  placeholder="宽度"
                />
                <input
                  id="customHeight"
                  name="customHeight"
                  type="number"
                  min="16"
                  max="3840"
                  step="16"
                  placeholder="高度"
                />
              </div>
            </div>
          </div>

          <div id="videoFields" class="row hidden">
            <div class="field">
              <label for="generationType">生成模式</label>
              <select id="generationType" name="generationType">
                <option value="TEXT" selected>文生视频</option>
                <option value="FIRST&LAST">首尾帧</option>
                <option value="REFERENCE">参考图</option>
              </select>
            </div>
            <div class="field">
              <label>时长</label>
              <div class="readonly-field">8S</div>
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="quality">质量</label>
              <select id="quality" name="quality">
                <option value="auto">auto</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
              </select>
            </div>
            <div class="field">
              <label for="n">数量</label>
              <input id="n" name="n" type="number" min="1" max="4" value="1" />
            </div>
          </div>

          <div class="actions">
            <button id="submitBtn" class="primary" type="submit">生成图片</button>
            <button id="stopBtn" class="secondary hidden" type="button" disabled>
              停止全部查询
            </button>
          </div>
          <div id="errorBox" class="alert hidden"></div>
        </form>

        <section class="panel result-panel" aria-live="polite">
          <div class="result-head">
            <h2 class="section-title" style="margin: 0">生成结果</h2>
            <div id="taskId" class="task-id">暂无任务</div>
          </div>
          <div class="result-body">
            <div id="emptyState" class="empty">
              <div>
                <div id="resultLoader" class="loader hidden"></div>
                <strong id="emptyTitle">等待第一张图</strong>
                <span id="emptyDescription">登录并提交后，生成结果会显示在这里并保存到作品。</span>
              </div>
            </div>
            <div id="gallery" class="gallery hidden"></div>
          </div>
        </section>
      </section>

      <section class="panel works-panel" aria-live="polite">
        <div class="works-head">
          <h2 class="section-title" style="margin: 0">作品</h2>
          <button id="refreshWorksBtn" class="secondary" type="button">刷新作品</button>
        </div>
        <div class="works-body">
          <div id="worksList" class="works-list"></div>
          <div id="emptyWorks" class="empty-works">你的生成作品会保存在这里。</div>
        </div>
      </section>
    </main>

    <script>
      const POLL_INTERVAL_MS = 30000;
      const MAX_POLLS = 120;

      const authForm = document.querySelector("#authForm");
      const emailInput = document.querySelector("#email");
      const passwordInput = document.querySelector("#password");
      const loginBtn = document.querySelector("#loginBtn");
      const registerBtn = document.querySelector("#registerBtn");
      const logoutBtn = document.querySelector("#logoutBtn");
      const authMessage = document.querySelector("#authMessage");
      const memberPill = document.querySelector("#memberPill");
      const profileSummary = document.querySelector("#profileSummary");
      const form = document.querySelector("#imageForm");
      const modeButtons = document.querySelectorAll("[data-generation-mode]");
      const submitBtn = document.querySelector("#submitBtn");
      const stopBtn = document.querySelector("#stopBtn");
      const errorBox = document.querySelector("#errorBox");
      const statusDot = document.querySelector("#statusDot");
      const statusText = document.querySelector("#statusText");
      const taskIdNode = document.querySelector("#taskId");
      const emptyState = document.querySelector("#emptyState");
      const resultLoader = document.querySelector("#resultLoader");
      const emptyTitle = document.querySelector("#emptyTitle");
      const emptyDescription = document.querySelector("#emptyDescription");
      const gallery = document.querySelector("#gallery");
      const worksList = document.querySelector("#worksList");
      const emptyWorks = document.querySelector("#emptyWorks");
      const refreshWorksBtn = document.querySelector("#refreshWorksBtn");
      const referenceFilesInput = document.querySelector("#referenceFiles");
      const referenceFileStatus = document.querySelector("#referenceFileStatus");
      const referencePreview = document.querySelector("#referencePreview");
      const modelSelect = document.querySelector("#model");
      const sizeSelect = document.querySelector("#size");
      const customSizeFields = document.querySelector("#customSizeFields");
      const qualitySelect = document.querySelector("#quality");
      const nInput = document.querySelector("#n");
      const generationTypeSelect = document.querySelector("#generationType");
      const videoFields = document.querySelector("#videoFields");

      const activeTasks = new Map();
      let currentUser = null;
      let referenceImages = [];
      let uploadedReferenceImages = [];
      let generationMode = "image";

      const imageOptions = {
        model: [{ value: "gpt-image-2", label: "GPT2" }],
        size: [
          "auto",
          "1024x1024",
          "1792x1024",
          "1024x1792",
          "3840x2160",
          "2560x1440",
          "1:1",
          "3:2",
          "2:3",
          "16:9",
          "9:16",
          "1:2",
          "2:1",
          "4:3",
          "3:4",
          "5:4",
          "4:5",
          "custom",
        ],
        quality: ["auto", "low", "medium", "high"],
      };
      const videoOptions = {
        model: [{ value: "veo3.1-fast", label: "VEO3.1 Fast" }],
        size: ["16:9", "9:16"],
        quality: ["720p", "1080p"],
      };

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function toImageSrc(url) {
        return /^https?:\/\//i.test(url) || /^data:/i.test(url)
          ? url
          : `data:image/png;base64,${url}`;
      }

      function toMediaSrc(url) {
        return /^https?:\/\//i.test(url) || /^data:/i.test(url) ? url : toImageSrc(url);
      }

      function setSelectOptions(select, options) {
        select.innerHTML = options
          .map((option) => {
            const value = typeof option === "string" ? option : option.value;
            const label = typeof option === "string" ? (option === "custom" ? "自定义尺寸" : option) : option.label;
            return `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`;
          })
          .join("");
      }

      function setStatus(text, tone = "idle") {
        statusText.textContent = text;
        statusDot.className = `dot ${tone === "idle" ? "" : tone}`;
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.toggle("hidden", !message);
      }

      function setAuthMessage(message) {
        authMessage.textContent = message || "";
      }

      function renderProfileSummary(items) {
        profileSummary.innerHTML = items
          .map(
            (item) => `
              <span class="info-pill">
                ${item.dot ? `<span class="dot ${item.tone || ""}"></span>` : ""}
                ${escapeHtml(item.text)}
              </span>
            `,
          )
          .join("");
      }

      function refreshProfileSummary() {
        if (!currentUser) {
          renderProfileSummary([
            { text: "未登录", dot: true },
            { text: activeTasks.size > 0 ? `${activeTasks.size} 个任务后台生成中` : "暂无后台任务" },
          ]);
          return;
        }

        const dailyLeft =
          currentUser.dailyQuota == null
            ? "不限"
            : Math.max(0, currentUser.dailyQuota - currentUser.usedToday);
        const totalLeft =
          currentUser.totalQuota == null
            ? "不限"
            : Math.max(0, currentUser.totalQuota - currentUser.usedTotal);
        const videoLeft =
          currentUser.videoQuota == null
            ? "不限"
            : Math.max(0, currentUser.videoQuota - (currentUser.videoUsed || 0));
        renderProfileSummary([
          { text: currentUser.email },
          {
            text: currentUser.isMember ? "会员已开通" : "等待开通",
            dot: true,
            tone: currentUser.isMember ? "done" : "",
          },
          { text: `今日 ${dailyLeft}` },
          { text: `总量 ${totalLeft}` },
          { text: `视频 ${videoLeft}` },
          {
            text: activeTasks.size > 0 ? `${activeTasks.size} 个任务后台生成中` : "暂无后台任务",
            dot: activeTasks.size > 0,
            tone: activeTasks.size > 0 ? "running" : "",
          },
        ]);
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          credentials: "include",
          ...options,
          headers: {
            ...(options.body && !(options.body instanceof FormData)
              ? { "Content-Type": "application/json" }
              : {}),
            ...(options.headers || {}),
          },
        });
        const text = await response.text();
        let data = {};
        try {
          data = text ? JSON.parse(text) : {};
        } catch {
          data = { raw: text };
        }
        if (!response.ok) {
          throw new Error(data?.message || data?.error || data?.raw || `请求失败：HTTP ${response.status}`);
        }
        return data;
      }

      function updateUserUI() {
        if (!currentUser) {
          memberPill.textContent = "未登录";
          memberPill.classList.add("hidden");
          authForm.classList.remove("hidden");
          loginBtn.classList.remove("hidden");
          registerBtn.classList.remove("hidden");
          logoutBtn.classList.add("hidden");
          submitBtn.disabled = true;
          setStatus("待登录", "idle");
          refreshProfileSummary();
          setAuthMessage("注册后需管理员手动开通会员，开通前不能生成图片。");
          return;
        }

        memberPill.classList.add("hidden");
        authForm.classList.add("hidden");
        loginBtn.classList.add("hidden");
        registerBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
        emailInput.value = currentUser.email;
        passwordInput.value = "";

        const dailyLeft =
          currentUser.dailyQuota == null
            ? "不限"
            : Math.max(0, currentUser.dailyQuota - currentUser.usedToday);
        const totalLeft =
          currentUser.totalQuota == null
            ? "不限"
            : Math.max(0, currentUser.totalQuota - currentUser.usedTotal);
        const videoLeft =
          currentUser.videoQuota == null
            ? "不限"
            : Math.max(0, currentUser.videoQuota - (currentUser.videoUsed || 0));

        memberPill.textContent = currentUser.isMember
          ? `会员 · 今日 ${dailyLeft} · 总量 ${totalLeft} · 视频 ${videoLeft}`
          : "待管理员开通";
        refreshProfileSummary();
        submitBtn.disabled = !currentUser.isMember;
        setStatus(currentUser.isMember ? "可以生成" : "等待开通", currentUser.isMember ? "done" : "idle");
        setAuthMessage(
          currentUser.isMember
            ? "会员已开通，可以提交生成任务。"
            : "账号已注册，请联系管理员开通会员和次数。",
        );
      }

      async function loadMe() {
        try {
          const data = await requestJson("/api/me");
          currentUser = data.user;
        } catch {
          currentUser = null;
        }
        updateUserUI();
        await loadWorks();
      }

      async function auth(mode) {
        setAuthMessage("");
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
          setAuthMessage("请输入邮箱和密码。");
          return;
        }
        const data = await requestJson(`/api/auth/${mode}`, {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        currentUser = data.user;
        updateUserUI();
        setAuthMessage(
          mode === "register"
            ? "注册成功，账号已登录。请联系管理员开通会员后再生成图片。"
            : "登录成功。",
        );
        await loadWorks();
      }

      async function collectReferenceImages() {
        return uploadedReferenceImages.map((item) => item.url);
      }

      async function uploadReferenceFile(file) {
        if (!currentUser) throw new Error("请先登录后再上传参考图。");
        const formData = new FormData();
        formData.append("file", file);
        const data = await requestJson("/api/uploads/reference", {
          method: "POST",
          body: formData,
        });
        return {
          url: data.url,
          name: file.name,
        };
      }

      function renderReferencePreview(items = referenceImages) {
        referencePreview.innerHTML = items
          .map(
            (src, index) => `
              <div class="reference-item">
                <img src="${src}" alt="参考图" loading="lazy" />
                <button class="reference-remove" type="button" data-reference-index="${index}" aria-label="删除参考图">×</button>
              </div>
            `,
          )
          .join("");
        referencePreview.classList.toggle("hidden", items.length === 0);
        referenceFileStatus.textContent =
          uploadedReferenceImages.length > 0
            ? `已上传 ${uploadedReferenceImages.length} 张图片`
            : "未选择图片";
      }

      function removeReferenceImage(index) {
        uploadedReferenceImages.splice(index, 1);
        referenceFilesInput.value = "";
        referenceFileStatus.textContent =
          uploadedReferenceImages.length > 0
            ? `已上传 ${uploadedReferenceImages.length} 张图片`
            : "未选择图片";
      }

      function resolveSize(formData) {
        const selectedSize = String(formData.get("size") || "auto");
        if (selectedSize !== "custom") return selectedSize;

        const width = Number(formData.get("customWidth"));
        const height = Number(formData.get("customHeight"));
        const pixels = width * height;
        if (!Number.isInteger(width) || !Number.isInteger(height)) {
          throw new Error("请输入有效的自定义宽度和高度。");
        }
        if (width < 16 || width > 3840 || height < 16 || height > 3840) {
          throw new Error("自定义尺寸每条边必须在 16 到 3840 之间。");
        }
        if (width % 16 !== 0 || height % 16 !== 0) {
          throw new Error("自定义宽度和高度都必须能被 16 整除。");
        }
        if (pixels < 655360 || pixels > 8294400) {
          throw new Error("自定义尺寸像素预算必须在 655,360 到 8,294,400 之间。");
        }
        return `${width}x${height}`;
      }

      function updateTaskControls() {
        stopBtn.disabled = activeTasks.size === 0;
      }

      function getModeCopy() {
        if (generationMode === "video") {
          return {
            idleTitle: "等待第一段视频",
            idleDescription: "提交后，视频生成结果会显示在这里并保存到作品。",
            loadingTitle: "视频正在生成中",
            loadingDescription: "任务已提交，系统会在后台自动查询结果，完成后保存到作品。",
            submitText: "生成视频",
          };
        }
        return {
          idleTitle: "等待第一张图",
          idleDescription: "登录并提交后，生成结果会显示在这里并保存到作品。",
          loadingTitle: "图片正在生成中",
          loadingDescription: "任务已提交，系统会在后台自动查询结果，完成后保存到作品。",
          submitText: "生成图片",
        };
      }

      function updateModeUI() {
        const copy = getModeCopy();
        const options = generationMode === "video" ? videoOptions : imageOptions;
        modeButtons.forEach((button) => {
          const isActive = button.dataset.generationMode === generationMode;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-selected", String(isActive));
        });
        setSelectOptions(modelSelect, options.model);
        setSelectOptions(sizeSelect, options.size);
        setSelectOptions(qualitySelect, options.quality);
        sizeSelect.value = generationMode === "video" ? "16:9" : "auto";
        qualitySelect.value = generationMode === "video" ? "1080p" : "auto";
        customSizeFields.classList.add("hidden");
        videoFields.classList.toggle("hidden", generationMode !== "video");
        nInput.closest(".field").classList.toggle("hidden", generationMode === "video");
        generationTypeSelect.value = "TEXT";
        submitBtn.textContent = copy.submitText;
        if (!emptyState.classList.contains("hidden")) {
          resultLoader.classList.add("hidden");
          emptyTitle.textContent = copy.idleTitle;
          emptyDescription.textContent = copy.idleDescription;
        }
      }

      function setResultLoading(isLoading) {
        const copy = getModeCopy();
        gallery.classList.add("hidden");
        emptyState.classList.remove("hidden");
        resultLoader.classList.toggle("hidden", !isLoading);
        emptyTitle.textContent = isLoading ? copy.loadingTitle : copy.idleTitle;
        emptyDescription.textContent = isLoading
          ? copy.loadingDescription
          : copy.idleDescription;
      }

      function updateActiveStatus(fallbackText = "可以生成", fallbackTone = "done") {
        if (activeTasks.size > 0) {
          setStatus(`${activeTasks.size} 个任务后台生成中`, "running");
          taskIdNode.textContent = `后台任务：${activeTasks.size} 个`;
          refreshProfileSummary();
          return;
        }
        setStatus(fallbackText, fallbackTone);
        refreshProfileSummary();
      }

      function renderMedia(urls, mediaType = "image") {
        gallery.innerHTML = urls
          .map((url, index) => {
            const src = toMediaSrc(url);
            const label = mediaType === "video" ? `视频 ${index + 1}` : `图片 ${index + 1}`;
            const preview = mediaType === "video"
              ? `<video src="${src}" controls preload="metadata"></video>`
              : `<img src="${src}" alt="${label}" loading="lazy" />`;
            return `
              <article class="image-card">
                ${preview}
                <div class="image-actions">
                  <span class="hint">${label}</span>
                  <a href="${src}" target="_blank" rel="noreferrer">预览</a>
                </div>
              </article>
            `;
          })
          .join("");
        gallery.classList.remove("hidden");
        emptyState.classList.add("hidden");
      }

      function renderImages(urls) {
        renderMedia(urls, "image");
      }

      function renderWorks(works) {
        worksList.innerHTML = works
          .map((work) => {
            const mediaType = work.mediaType || "image";
            const src = toMediaSrc(work.url);
            const prompt = escapeHtml(work.prompt || "未命名作品");
            const time = escapeHtml(work.createdAt || "");
            const size = escapeHtml(work.size || "");
            const preview = mediaType === "video"
              ? `<video src="${src}" controls preload="metadata"></video>`
              : `<img src="${src}" alt="${prompt}" loading="lazy" />`;
            return `
              <article class="image-card">
                ${preview}
                <div class="work-meta">
                  <div class="work-prompt" title="${prompt}">${prompt}</div>
                  <div class="work-info">${mediaType === "video" ? "视频" : "图片"}${time ? ` · ${time}` : ""}${size ? ` · ${size}` : ""}</div>
                  <a href="${src}" target="_blank" rel="noreferrer">预览</a>
                </div>
              </article>
            `;
          })
          .join("");
        emptyWorks.classList.toggle("hidden", works.length > 0);
      }

      async function loadWorks() {
        if (!currentUser) {
          renderWorks([]);
          return;
        }
        const data = await requestJson(`/api/works?ts=${Date.now()}`);
        renderWorks(data.works || []);
      }

      async function refreshWorksNow() {
        const previousText = refreshWorksBtn.textContent;
        refreshWorksBtn.disabled = true;
        refreshWorksBtn.textContent = "刷新中...";
        showError("");
        try {
          const tasks = [...activeTasks.values()];
          await Promise.all(tasks.map((task) => checkTaskOnce(task)));
          await loadWorks();
        } catch (error) {
          showError(error.message);
        } finally {
          refreshWorksBtn.disabled = false;
          refreshWorksBtn.textContent = previousText;
        }
      }

      async function checkTaskOnce(task) {
        const payload = await requestJson(`/api/tasks/${encodeURIComponent(task.id)}?ts=${Date.now()}`);
        const mediaType = payload.mediaType || task.mediaType || "image";
        const media = mediaType === "video" ? payload.videos || [] : payload.images || [];
        if (media.length > 0) {
          renderMedia(media, mediaType);
          activeTasks.delete(task.id);
          updateTaskControls();
          await loadMe();
          updateActiveStatus("生成完成，已保存到作品", "done");
        }
      }

      async function pollTask(task) {
        task.pollCount += 1;
        updateActiveStatus();
        try {
          const payload = await requestJson(`/api/tasks/${encodeURIComponent(task.id)}`);
          const mediaType = payload.mediaType || task.mediaType || "image";
          const media = mediaType === "video" ? payload.videos || [] : payload.images || [];

          if (media.length > 0) {
            renderMedia(media, mediaType);
            activeTasks.delete(task.id);
            updateTaskControls();
            await loadMe();
            await loadWorks();
            updateActiveStatus("生成完成，已保存到作品", "done");
            return;
          }

          if (["failed", "failure", "error", "cancelled", "canceled"].includes(payload.status)) {
            throw new Error(payload.message || (mediaType === "video" ? "视频生成失败" : "图片生成失败"));
          }

          if (task.pollCount >= MAX_POLLS) {
            activeTasks.delete(task.id);
            updateTaskControls();
            updateActiveStatus("有任务查询超时", "error");
            showError(`任务 ${task.id} 还没有返回结果，已达到最大查询次数。`);
            return;
          }

          task.timer = setTimeout(() => pollTask(task), POLL_INTERVAL_MS);
        } catch (error) {
          activeTasks.delete(task.id);
          updateTaskControls();
          updateActiveStatus("有任务查询失败", "error");
          showError(`任务 ${task.id} 查询失败：${error.message}`);
        }
      }

      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          await auth("login");
        } catch (error) {
          setAuthMessage(error.message);
        }
      });

      registerBtn.addEventListener("click", async () => {
        try {
          await auth("register");
        } catch (error) {
          setAuthMessage(error.message);
        }
      });

      logoutBtn.addEventListener("click", async () => {
        await requestJson("/api/auth/logout", { method: "POST" });
        currentUser = null;
        activeTasks.clear();
        renderWorks([]);
        updateUserUI();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showError("");
        if (!currentUser?.isMember) {
          showError("请先登录并等待管理员开通会员。");
          return;
        }

        const formData = new FormData(form);
        const prompt = String(formData.get("prompt") || "").trim();
        const model = String(formData.get("model") || "").trim();
        const n = Number(formData.get("n") || 1);
        let size = "auto";
        if (!prompt || !model) {
          showError("请填写提示词和模型。");
          return;
        }
        try {
          size = generationMode === "video" ? String(formData.get("size") || "16:9") : resolveSize(formData);
          referenceImages = await collectReferenceImages();
          renderReferencePreview();
          if (generationMode === "video") {
            const generationType = String(formData.get("generationType") || "TEXT");
            if (generationType === "TEXT" && referenceImages.length > 0) {
              throw new Error("文生视频模式不需要参考图，请删除参考图或切换生成模式。");
            }
            if (generationType !== "TEXT" && referenceImages.length === 0) {
              throw new Error("首尾帧/参考图模式需要先上传参考图。");
            }
            if (generationType === "REFERENCE" && size === "9:16") {
              throw new Error("REFERENCE 模式暂不支持 9:16。");
            }
          }
        } catch (error) {
          showError(error.message);
          return;
        }

        setStatus("创建任务中", "running");
        taskIdNode.textContent = "正在创建任务...";
        setResultLoading(true);
        const payload =
          generationMode === "video"
            ? {
                model,
                prompt,
                aspect_ratio: size,
                duration: 8,
                generation_type: formData.get("generationType"),
                quality: formData.get("quality"),
                image_urls: referenceImages,
              }
            : {
                model,
                prompt,
                n,
                size,
                quality: formData.get("quality"),
                image: referenceImages,
              };

        try {
          const result = await requestJson(
            generationMode === "video" ? "/api/videos/generations" : "/api/images/generations",
            {
            method: "POST",
            body: JSON.stringify(payload),
            },
          );
          const task = {
            id: result.id,
            mediaType: generationMode === "video" ? "video" : "image",
            pollCount: 0,
            timer: null,
          };
          activeTasks.set(task.id, task);
          updateTaskControls();
          updateActiveStatus();
          await pollTask(task);
        } catch (error) {
          updateActiveStatus("创建失败", "error");
          showError(error.message);
        }
      });

      stopBtn.addEventListener("click", () => {
        activeTasks.forEach((task) => task.timer && clearTimeout(task.timer));
        activeTasks.clear();
        updateTaskControls();
      });

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          generationMode = button.dataset.generationMode || "image";
          showError("");
          updateModeUI();
        });
      });

      referenceFilesInput.addEventListener("change", async () => {
        try {
          const files = Array.from(referenceFilesInput.files || []);
          if (files.length > 0) {
            setStatus("上传参考图中", "running");
            referenceFileStatus.textContent = `正在上传 ${files.length} 张图片...`;
            const uploaded = await Promise.all(files.map(uploadReferenceFile));
            uploadedReferenceImages = [...uploadedReferenceImages, ...uploaded];
            setStatus("参考图已上传", "done");
          }
          referenceImages = await collectReferenceImages();
          renderReferencePreview();
        } catch (error) {
          showError(error.message);
        } finally {
          referenceFilesInput.value = "";
        }
      });

      referencePreview.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-reference-index]");
        if (!button) return;
        removeReferenceImage(Number(button.dataset.referenceIndex));
        referenceImages = await collectReferenceImages();
        renderReferencePreview();
      });

      sizeSelect.addEventListener("change", () => {
        customSizeFields.classList.toggle("hidden", sizeSelect.value !== "custom");
      });

      refreshWorksBtn.addEventListener("click", refreshWorksNow);

      updateModeUI();
      loadMe();
    </script>
  </body>
</html>
